<section class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-login-logo">Eleven <span>11</span></div>
    <p class="admin-login-sub">Admin Panel Login</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" required>
      </div>

      <p class="login-error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!loginForm.valid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</section>
