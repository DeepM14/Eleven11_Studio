<div class="admin-section">
  <h2 class="section-title">Manage <span class="gold-text">Gallery</span></h2>
  <p class="section-subtitle">Upload, edit captions, or delete gallery photos.</p>

  <!-- Upload form -->
  <div class="admin-form-card">
    <h3>Add New Photo</h3>

    <div class="form-group">
      <label>Photo</label>
      <input type="file" accept="image/*" (change)="onFileSelected($event)">
    </div>

    <div class="upload-preview" *ngIf="previewUrl">
      <img [src]="previewUrl" alt="Preview">
    </div>

    <div class="form-group">
      <label>Caption</label>
      <input type="text" [(ngModel)]="newItem.caption" placeholder="e.g. Bridal Updo">
    </div>

    <div class="form-group">
      <label>Category</label>
      <select [(ngModel)]="newItem.category">
        <option value="Hair">Hair</option>
        <option value="Makeup">Makeup</option>
        <option value="Bridal">Bridal</option>
        <option value="Spa">Spa</option>
      </select>
    </div>

    <p class="upload-status" *ngIf="uploading">Uploading... please wait.</p>
    <p class="upload-error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <button class="btn btn-primary" (click)="addPhoto()" [disabled]="uploading || !selectedFile">
      {{ uploading ? 'Uploading...' : 'Add Photo' }}
    </button>
  </div>

  <!-- Existing photos -->
  <div class="admin-list">
    <h3>Current Photos ({{ items.length }})</h3>

    <p class="empty-msg" *ngIf="!loading && items.length === 0">No photos yet — add your first one above.</p>
    <p class="empty-msg" *ngIf="loading">Loading...</p>

    <div class="admin-category-block" *ngFor="let cat of categoryNames">
  <h4 class="admin-category-title">{{ cat }}</h4>
  <div class="admin-photo-grid">
    <div class="admin-photo-card" *ngFor="let item of getByCategory(cat)">
      <img [src]="item.img" [alt]="item.caption">
      <div class="admin-photo-body">
        <strong>{{ item.caption }}</strong>
        <button class="btn-delete" (click)="deletePhoto(item.id)">Delete</button>
      </div>
    </div>
  </div>
  <p class="empty-msg" *ngIf="getByCategory(cat).length === 0">No photos in this category yet.</p>
</div>
  </div>
</div>
